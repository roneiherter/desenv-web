<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Atividade 2</title>
</head>
<body>

    <form>
        <fieldset>
            <legend>Crie sua Conta</legend>

            <!-- Nome -->
            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" name="nome"><br><br>

            <!-- Email -->
            <label for="ema
            il">E-mail:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <!-- Senha -->
            <label for="senha">Senha:</label><br>
            <input type="password" id="senha" name="senha" minlength="8" required><br><br>

            <!-- Gênero -->
            <strong>Gênero</strong><br>

            <input type="radio" id="masculino" name="genero" value="Masculino">
            <label for="masculino">Masculino</label><br>

            <input type="radio" id="feminino" name="genero" value="Feminino">
            <label for="feminino">Feminino</label><br><br>

            <!-- Biografia -->
            <label for="bio">Biografia:</label><br>
            <textarea id="bio" name="biografia" rows="4" placeholder="Conte um pouco sobre você..."></textarea><br><br>

            <!-- Termos -->
            <input type="checkbox" id="termos" name="termos" required>
            <label for="termos">Concordo com os termos de uso</label><br><br>

            <!-- Botão -->
            <button type="submit">Cadastrar</button>

        </fieldset>
    </form>

</body>
</html>
